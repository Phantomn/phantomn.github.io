# 한화파워 CRA/제품보안 맞춤 변형 국문
# 베이스: Hong_Seungpyo_CV_tuv_kor.yaml. 자동차 경험 없음 -> 미기재. TARA 약어 미사용(21434 오인 방지).
# 재조정: CRA/SBOM/SDL을 K-MELLODDY 기반 보유 경험으로 승격.
cv:
  name: 홍승표
  headline: 산업 제품 사이버보안 | IEC 62443 · EU CRA
  email: newbiepwner@kakao.com
  location: 서울특별시
  website: https://phantomn.github.io
  social_networks:
    - network: GitHub
      username: phantomn
    - network: LinkedIn
      username: ph4nt0m

  sections:
    요약:
      - "산업제어시스템(OT/ICS)·제조 제품 사이버보안 6년 경력. LS ELECTRIC 자동화기기를 위협 모델링부터 IEC 62443-4-2 컴포넌트 인증(Achilles Level 2)까지 지원해 취득에 기여했고, 신약개발 연합학습 플랫폼(K-MELLODDY)에서 NIST SSDF 기반 보안 개발 생명주기(SDL) 정의와 공급망 보안 체계(SBOM/VEX/EoS)를 수립하며 EU CRA·IEC 62443·FDA를 검토했습니다. 결함을 인증 심사를 통과하는 감사 증적으로 옮기는 데 강점. CVE 21건, NATO Locked Shields 2025 DFIR CTF 1위."

    경력:
      - company: 코어시큐리티 (CoreSecurity)
        position: ICS 보안연구팀 주임 연구원
        location: 서울
        start_date: 2021-06
        end_date: present
        highlights:
          - "IEC 62443-4-2 위협 모델링(STRIDE·DREAD)·컴포넌트 요구사항(CR) 점검·모의해킹 — LS ELECTRIC Achilles Level 2 통신 견고성 인증 취득 기여 및 자동 점검 도구 개발"
          - "K-MELLODDY 연합학습 플랫폼 — NIST SSDF 기반 SDL 정의, SBOM/VEX/EoS 공급망 보안 체계 수립, EU CRA·IEC 62443·ISO 27001 규제 검토"
          - "제품 인증 대응 — 의료기기 FDA Premarket Cybersecurity/eSTAR 문서화, Cybersecurity Controls 인증 지원, 스마트선박(CBS) 취약점 점검 도구 개발"
          - "결함마다 재현 절차·패킷을 제조사 개발팀에 전달하고 수정·재검증을 반복해 인증 통과 기준을 함께 정립"
          - "한국전력 실전형 사이버 공방 훈련(ELECCON) 2021~2024 4회 운영 및 OT/ICS 시나리오 개발"
          - "**NATO CCDCOE Locked Shields 2025** 한국-캐나다 연합 DFIR 블루팀 — 훈련 종합 6위, **DFIR CTF 1위**"
          - "**NATO CCDCOE Locked Shields 2026** 한국-헝가리 연합 Special System 블루팀 — 훈련 종합 9위"

      - company: A3 Security
        position: 보안기술팀 사원
        location: 서울
        start_date: 2020-06
        end_date: 2021-06
        highlights:
          - "금융권 및 공공기관 전자금융기반시설 모의해킹 12개 사이트 — 고위험 취약점 평균 1~2건/사이트 식별"
          - "KT 기가지니 AI 스피커(UART 기반 펌웨어 분석), 농협중앙회 RPA, IoT 열감지 장비 등 비정형·임베디드 시스템 보안성 검토"
          - "ISMS/ISO 27001 인증 취득 지원 컨설팅 (코웨이)"
          - "참저축은행, 애큐온캐피탈, SBI저축은행, 현대자동차 HKMC 등 모의해킹"

    학력:
      - institution: 공주대학교 (Kongju National University)
        area: 컴퓨터공학부
        degree: 학사
        location: 충남
        start_date: 2012-02
        end_date: 2020-02

      - institution: KITRI Best of the Best (BoB) 8기
        area: 취약점 분석 트랙
        location: 서울
        start_date: 2019-07
        end_date: 2020-02

      - institution: 천안상업고등학교
        area: 정보처리과
        location: 충남
        start_date: 2009-03
        end_date: 2012-02

    취약점_연구:
      - label: "OS Kernel CVE 16건 — Best of the Best 8기"
        details: "커스텀 File System Fuzzer 설계·구현으로 Linux Kernel CVE 16건(0-day 포함) 도출. **CodeBlue 2019** (도쿄) · **Hack In The Box 2019** (암스테르담) 발표. CVE-2019-18885, 19036, 19037, 19039, 19318, 19319, 19377, 19378, 19447, 19448, 19449, 19813, 19814, 19815, 19816, 19927"

      - label: "IoT CVE 5건 — 개인 연구"
        details: "임베디드/IoT 장비 취약점 분석 (UART 펌웨어 접근, binwalk 플래시 추출). CVE-2024-33788 (CVSS 8.0 HIGH), CVE-2024-33789 (CVSS 9.8 CRITICAL), CVE-2024-33791 (CVSS 4.6 MEDIUM), CVE-2024-33792 (CVSS 9.8 CRITICAL), CVE-2024-33793 (CVSS 5.3 MEDIUM)"

      - label: "버그바운티 3건 — 접근통제 결함"
        details: "프로덕션 웹 서비스 취약점 신고. 인증 없이 전 회원 비밀번호 변경 가능 (CVSS 9.8 Critical, Broken Access Control) 포함 3건 — 소스코드 수준 근본 원인 규명 및 서로 다른 계정으로 100% 재현"

    프로젝트:
      - name: "ELECCON — 한국전력 사이버 공방 훈련"
        date: "2021 – 2024"
        highlights:
          - "국내 최대 OT/ICS 실전형 사이버 공방 훈련 4년 연속 운영"
          - "SCADA/PLC 기반 공격 시나리오 설계 및 방어팀 평가 지표 수립"

      - name: File System Fuzzer (BoB 8기)
        date: "2019"
        highlights:
          - "커스텀 Fuzzer 설계·구현 → Linux Kernel CVE 16건 도출"
          - "CodeBlue 2019 (도쿄), Hack In The Box 2019 (암스테르담) 발표"

      - name: "K-MELLODDY — 연합학습 신약개발 플랫폼 보안 내재화"
        date: "2024"
        highlights:
          - "NIST SSDF 기반 안전한 개발 프로세스(SDL) 분석·정의, IEC 62443·FDA·ISO 27001·EU CRA 규제 검토"
          - "SBOM/VEX/EoS 공급망 보안 관리 체계 수립, 위협 모델링 기반 소스코드 레벨 보안 통제(API) 적용 및 운영 환경 모의해킹"

    기술:
      - label: OT / ICS · 임베디드
        details: "IEC 62443-4-2, Achilles Level 2, 산업용 프로토콜 분석 (Modbus, DNP3, PROFINET), 임베디드/펌웨어 분석 (UART, JTAG, binwalk)"

      - label: 표준 및 컴플라이언스
        details: "IEC 62443-4-2 (위협 모델링·인증), EU CRA 검토, NIST SSDF(SDL), SBOM/VEX/EoS 공급망 보안, FDA Premarket Cybersecurity/eSTAR, ISO 27001"

      - label: Offensive Security
        details: "OT/ICS 모의해킹, Web/App 모의해킹, Red Teaming, 익스플로잇 개발, 취약점 연구, Fuzzing, 위협 모델링(STRIDE/DREAD)"

      - label: 도구
        details: "IDA Pro, Burp Suite, Frida, CodeQL, pwndbg, Wireshark, Metasploit, Nmap"

      - label: 자격 및 언어
        details: "한국어 (모국어), 영어 (일상 회화) · 리눅스 마스터 2급 · 네트워크 관리사 2급"

