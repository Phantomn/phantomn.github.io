# TUV SUD Korea 맞춤 변형 국문 (Requisition ID 6323, Cybersecurity Consultant - OT/Mobility/IoT)
# 베이스: Hong_Seungpyo_CV_kor.yaml. 자동차 경험 없음 -> 미기재.
# 재조정: OT/ICS + IEC 62443 + TARA + 규제 컴플라이언스. 신규 규제는 "전이 가능"으로만 표기.
cv:
  name: 홍승표
  headline: OT/ICS · 임베디드 보안 연구원 | IEC 62443
  email: newbiepwner@kakao.com
  location: 서울특별시
  website: https://phantomn.github.io
  social_networks:
    - network: GitHub
      username: phantomn
    - network: LinkedIn
      username: ph4nt0m

  sections:
    요약:
      - "산업제어시스템(OT/ICS)·임베디드 보안 6년 경력. LS ELECTRIC 자동화기기를 IEC 62443-4-2 위협분석 및 위험평가(TARA)부터 Achilles Level 2 인증까지 지원했으며, CVE 24건(Linux Kernel 16 + IoT 5 + LLM 3) 보유. 모의해킹·익스플로잇 개발과 결함을 인증 심사를 통과하는 감사 증적으로 옮기는 데 강점 — RED(EN 18031)·Cyber Resilience Act·NIS2 컴플라이언스 평가로 직접 전이 가능한 기반. NATO CCDCOE Locked Shields 2025 DFIR CTF 1위."

    경력:
      - company: 코어시큐리티 (CoreSecurity)
        position: ICS 보안연구팀 주임 연구원
        location: 서울
        start_date: 2021-06
        end_date: present
        highlights:
          - "IEC 62443-4-2 기반 위협분석·위험평가(TARA) 및 모의해킹 — LS ELECTRIC 자동화기기 Achilles Level 2 인증 취득 기여"
          - "고객 개발팀의 컴플라이언스 여정 지원: 결함별 재현 절차·수정·재검증을 감사 증적으로 정리"
          - "FDA eSTAR / 510(k) 보안 컨설팅 및 의료기기 모의해킹"
          - "스마트빌딩 IoT 취약점 탐지 기술 개발 및 실증, IoT/CCTV 침해사고 조사 도구 개발"
          - "한국전력 실전형 사이버 공방 훈련(ELECCON) 2021~2024 4회 운영 및 문제 개발"
          - "**NATO CCDCOE Locked Shields 2025** 한국-캐나다 연합 DFIR 블루팀 — 훈련 종합 6위, **DFIR CTF 1위**"
          - "**NATO CCDCOE Locked Shields 2026** 한국-헝가리 연합 Special System 블루팀 — 훈련 종합 9위"

      - company: A3 Security
        position: 보안기술팀 사원
        location: 서울
        start_date: 2020-06
        end_date: 2021-06
        highlights:
          - "금융권 및 공공기관 전자금융기반시설 모의해킹 12개 사이트 — 고위험 취약점 평균 1~2건/사이트 식별"
          - "KT 기가지니 AI 스피커(UART 기반 펌웨어 분석), 농협중앙회 RPA, IoT 열감지 장비 등 비정형·임베디드 시스템 보안성 검토"
          - "ISMS/ISO 27001 인증 취득 지원 컨설팅 (코웨이)"
          - "참저축은행, 애큐온캐피탈, SBI저축은행, 현대자동차 HKMC 등 모의해킹"

    학력:
      - institution: 공주대학교 (Kongju National University)
        area: 컴퓨터공학부
        degree: 학사
        location: 충남
        start_date: 2012-02
        end_date: 2020-02

      - institution: KITRI Best of the Best (BoB) 8기
        area: 취약점 분석 트랙
        location: 서울
        start_date: 2019-07
        end_date: 2020-02

      - institution: 천안상업고등학교
        area: 정보처리과
        location: 충남
        start_date: 2009-03
        end_date: 2012-02

    취약점_연구:
      - label: "OS Kernel CVE 16건 — Best of the Best 8기"
        details: "커스텀 File System Fuzzer 설계·구현으로 Linux Kernel CVE 16건(0-day 포함) 도출. **CodeBlue 2019** (도쿄) · **Hack In The Box 2019** (암스테르담) 발표. CVE-2019-18885, 19036, 19037, 19039, 19318, 19319, 19377, 19378, 19447, 19448, 19449, 19813, 19814, 19815, 19816, 19927"

      - label: "IoT CVE 5건 — 개인 연구"
        details: "임베디드/IoT 장비 취약점 분석 (UART 펌웨어 접근, binwalk 플래시 추출). CVE-2024-33788 (CVSS 8.0 HIGH), CVE-2024-33789 (CVSS 9.8 CRITICAL), CVE-2024-33791 (CVSS 4.6 MEDIUM), CVE-2024-33792 (CVSS 9.8 CRITICAL), CVE-2024-33793 (CVSS 5.3 MEDIUM)"

      - label: "LLM CVE 3건 — 개인 연구"
        details: "제품에 편입되는 AI 추론 컴포넌트(llama.cpp)의 공급망·견고성 결함을 표준 관점에서 검증. CVE-2026-52130 (CVSS 7.5 HIGH, 무제어 재귀 DoS), CVE-2026-52132 (CVSS 7.5 HIGH, 음수 파라미터 정수 오버플로 DoS), CVE-2026-52131 (CVSS 5.5 MEDIUM, 악성 모델 파일 로드 시 도달 가능한 어서션)"

      - label: "버그바운티 FVE 4건 — FindTheGap"
        details: "프로덕션 웹/API 접근통제·인증 미적용 결함 신고. 계정 탈취 1건 (CVSS 9.8 Critical), 개인정보 노출 3건 (CVSS 7.5 High) — 소스코드 수준 근본 원인 규명 및 서로 다른 계정으로 100% 재현"

    프로젝트:
      - name: "ELECCON — 한국전력 사이버 공방 훈련"
        date: "2021 – 2024"
        highlights:
          - "국내 최대 OT/ICS 실전형 사이버 공방 훈련 4년 연속 운영"
          - "SCADA/PLC 기반 공격 시나리오 설계 및 방어팀 평가 지표 수립"

      - name: File System Fuzzer (BoB 8기)
        date: "2019"
        highlights:
          - "커스텀 Fuzzer 설계·구현 → Linux Kernel CVE 16건 도출"
          - "CodeBlue 2019 (도쿄), Hack In The Box 2019 (암스테르담) 발표"

      - name: AI Orchestration Framework for Security
        date: "2024 – 현재"
        highlights:
          - "IDA Pro, Burp Suite, Frida, CodeQL을 MCP로 연결한 취약점 분석 자동화 파이프라인 — 실제 점검 대상에서 취약점 자동 식별"
          - "n8n · pgvector RAG 파이프라인으로 IEC 62443, ISO 27001 표준 문서 검색 적용"

    기술:
      - label: OT / ICS · 임베디드
        details: "IEC 62443-4-2, Achilles Level 2, 산업용 프로토콜 분석 (Modbus, DNP3, PROFINET), 임베디드/펌웨어 분석 (UART, JTAG, binwalk)"

      - label: 표준 및 컴플라이언스
        details: "보유: IEC 62443-4-2 (TARA·인증), FDA 510(k)/eSTAR, ISO 27001 · 전이 가능: RED/EN 18031, Cyber Resilience Act(CRA), NIS2"

      - label: Offensive Security
        details: "OT/ICS 모의해킹, Web/App 모의해킹, Red Teaming, 익스플로잇 개발, 취약점 연구, Fuzzing, 위협 모델링(STRIDE/DREAD)"

      - label: 도구
        details: "IDA Pro, Burp Suite, Frida, CodeQL, pwndbg, Wireshark, Metasploit, Nmap"

      - label: 자격 및 언어
        details: "한국어 (모국어), 영어 (일상 회화) · 리눅스 마스터 2급 · 네트워크 관리사 2급"

